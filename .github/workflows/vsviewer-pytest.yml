name: VsViewer tests

on:
  pull_request:
  push:
    branches: [add-jaehwi-effstress, vs30_refactor, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas pytest
      - run: python -m pytest VsViewer/tests
