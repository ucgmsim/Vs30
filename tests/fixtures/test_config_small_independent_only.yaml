# Test configuration - Small domain, Independent observations only
# 3km x 3km domain for fast testing

n_proc: 1

# --- Grid Parameters ---
grid_xmin: 1569500
grid_xmax: 1572500
grid_ymin: 5178500
grid_ymax: 5181500
grid_dx: 100
grid_dy: 100

# --- General Configuration ---
do_bayesian_update_of_geology_and_terrain_categorical_vs30_values: true
noisy: true
max_spatial_boolean_array_memory_gb: 1
obs_subsample_step_for_clustered: 10

# --- Observation files ---
independent_observations_file: observations/minimal_independent_observations.csv
clustered_observations_file: none

# Output directory - set at runtime
output_dir: /tmp/vs30_test_small_independent

# Combination method
combination_method: 1.0
