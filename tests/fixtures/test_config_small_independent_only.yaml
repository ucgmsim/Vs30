# Test configuration - Small domain, Independent observations only
# 3km x 3km domain for fast testing

# --- Grid Parameters ---
grid_xmin: 1569500
grid_xmax: 1572500
grid_ymin: 5178500
grid_ymax: 5181500
grid_dx: 100
grid_dy: 100

# --- Categorical model files ---
geology_categorical_csv: geology_model_posterior_from_foster_2019_mean_and_standard_deviation.csv
terrain_categorical_csv: terrain_model_posterior_from_foster_2019_mean_and_standard_deviation.csv

# --- Observation files ---
independent_observations_csv: minimal_independent_observations.csv
clustered_observations_csv:

# --- Pipeline settings ---
do_bayesian_update: true
noisy: true
combination_method: ratio
combine_ratio: 1.0
