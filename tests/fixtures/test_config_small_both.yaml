# Test configuration - Both observation types
# 10km x 10km domain at 1000m resolution for fast testing

# --- Grid Parameters ---
grid_xmin: 1565300
grid_xmax: 1575300
grid_ymin: 5175500
grid_ymax: 5185500
grid_dx: 1000
grid_dy: 1000

# --- Categorical model files ---
geology_categorical_csv: geology_model_posterior_from_foster_2019_mean_and_standard_deviation.csv
terrain_categorical_csv: terrain_model_posterior_from_foster_2019_mean_and_standard_deviation.csv

# --- Observation files ---
independent_observations_csv: test_independent_observations.csv
clustered_observations_csv: test_cpt_observations.csv

# --- Pipeline settings ---
do_bayesian_update: true
noisy: true
combination_method: ratio
combine_ratio: 1.0

apply_alluvium_slope_mod: true
apply_coastal_distance_mod: true
fill_gaps: false

geology_correlation:
  model: exponential
  phi: 1407

terrain_correlation:
  model: exponential
  phi: 993
