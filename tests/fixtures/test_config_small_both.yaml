# Test configuration - Both observation types
# 10km x 10km domain at 500m resolution for fast testing

# --- Grid Parameters ---
grid_xmin: 1565300
grid_xmax: 1575300
grid_ymin: 5175500
grid_ymax: 5185500
grid_dx: 500
grid_dy: 500

# --- Categorical model files ---
geology_categorical_csv: categorical_vs30_mean_and_stddev/geology/geology_model_posterior_from_foster_2019_mean_and_standard_deviation.csv
terrain_categorical_csv: categorical_vs30_mean_and_stddev/terrain/terrain_model_posterior_from_foster_2019_mean_and_standard_deviation.csv

# --- Observation files ---
independent_observations_csv: observations/test_independent_observations.csv
clustered_observations_csv: observations/test_cpt_observations.csv

# --- Pipeline settings ---
do_bayesian_update: true
noisy: true
combination_method: ratio
combine_ratio: 1.0
