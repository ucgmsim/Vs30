# Test configuration - Both independent and clustered observations
# 10km x 10km domain centered on University of Canterbury, Christchurch

n_proc: 1

# --- Grid Parameters ---
grid_xmin: 1565300
grid_xmax: 1575300
grid_ymin: 5175500
grid_ymax: 5185500
grid_dx: 100
grid_dy: 100

# --- General Configuration ---
do_bayesian_update_of_geology_and_terrain_categorical_vs30_values: true
noisy: true
max_spatial_boolean_array_memory_gb: 1

# --- Categorical model files ---
geology_categorical_file: categorical_vs30_mean_and_stddev/geology/geology_model_posterior_from_foster_2019_mean_and_standard_deviation.csv
terrain_categorical_file: categorical_vs30_mean_and_stddev/terrain/terrain_model_posterior_from_foster_2019_mean_and_standard_deviation.csv

# --- Observation files ---
independent_observations_file: observations/test_independent_observations.csv
clustered_observations_file: observations/test_cpt_observations.csv

# Output directory - set at runtime
output_dir: /tmp/vs30_test_both

# Combination method
combination_method: 1.0
