# ============================================================================
# Foster (2019) Vs30 Model Configuration
# Standard configuration reproducing the published NZ Vs30 map.
# ============================================================================

# --- Grid Parameters (full New Zealand extent at 100m resolution) ---
grid_xmin: 1060050
grid_xmax: 2120050
grid_ymin: 4730050
grid_ymax: 6250050
grid_dx: 100
grid_dy: 100

# --- Categorical model files (relative to resources directory) ---
# These contain the Foster (2019) posterior values, so no additional Bayesian
# update is performed (do_bayesian_update is false).
geology_categorical_file: categorical_vs30_mean_and_stddev/geology/geology_model_posterior_from_foster_2019_mean_and_standard_deviation.csv
terrain_categorical_file: categorical_vs30_mean_and_stddev/terrain/terrain_model_posterior_from_foster_2019_mean_and_standard_deviation.csv

# --- Observation files (relative to resources directory) ---
# Only independent observations are used for MVN spatial adjustment, matching
# the legacy default (--source original with posterior_paper mode).
independent_observations_file: observations/measured_vs30_independent_observations.csv

# --- Pipeline settings ---
do_bayesian_update_of_geology_and_terrain_categorical_vs30_values: false
noisy: true
# Equal weighting (50/50) matches the legacy default behavior.
combination_method: ratio
combine_ratio: 1.0

# --- Spatial update parameters ---
max_spatial_boolean_array_memory_gb: 1
