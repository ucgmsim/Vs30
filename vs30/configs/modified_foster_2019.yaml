# Modified Foster (2019) Vs30 Model Configuration
# Configuration based on the Foster (2019) NZ Vs30 map with modifications.

# --- Categorical model files (relative to resources directory) ---
# These contain the modified Foster (2019) posterior values, so no additional Bayesian
# update is performed (do_bayesian_update is false).
geology_categorical_csv: geology_model_posterior_from_foster_2019_mean_and_standard_deviation.csv
terrain_categorical_csv: terrain_model_posterior_from_foster_2019_mean_and_standard_deviation.csv

# --- Observation files (relative to resources directory) ---
# Only independent observations are used for MVN spatial adjustment, matching
# the legacy default (--source original with posterior_paper mode).
independent_observations_csv: modified_foster_2019_measured_vs30_independent_observations.csv
clustered_observations_csv:

# --- Pipeline settings ---
do_bayesian_update: false
noisy: true
combination_method: ratio
combine_ratio: 1.0

apply_alluvium_slope_mod: true
apply_coastal_distance_mod: true

geology_correlation:
  model: exponential
  phi: 1407

terrain_correlation:
  model: exponential
  phi: 993
