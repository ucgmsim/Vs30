# ============================================================================
# Viktor CPT Clustering Prototype Configuration
# Reproduces the legacy codebase behavior with --source cpt --gupdate posterior
# --tupdate posterior: starts from raw priors and performs a live Bayesian
# update using DBSCAN-clustered CPT observations.
# ============================================================================

# --- Grid Parameters (full New Zealand extent at 100m resolution) ---
grid_xmin: 1060050
grid_xmax: 2120050
grid_ymin: 4730050
grid_ymax: 6250050
grid_dx: 100
grid_dy: 100

# --- Categorical model files (relative to resources directory) ---
# Raw priors — the Bayesian update below will compute posteriors from these.
geology_categorical_file: categorical_vs30_mean_and_stddev/geology/geology_model_prior_mean_and_standard_deviation.csv
terrain_categorical_file: categorical_vs30_mean_and_stddev/terrain/terrain_model_prior_mean_and_standard_deviation.csv

# --- Observation files (relative to resources directory) ---
# Only clustered (CPT) observations, matching legacy --source cpt.
clustered_observations_file: observations/measured_vs30_cpt.csv

# --- Pipeline settings ---
do_bayesian_update_of_geology_and_terrain_categorical_vs30_values: true
noisy: true
# Equal weighting (50/50) matches the legacy default behavior.
combination_method: ratio
combine_ratio: 1.0

# --- Spatial update parameters ---
max_spatial_boolean_array_memory_gb: 1
