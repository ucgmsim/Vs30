# Approximate reproduction of the Foster (2019) Vs30 model.
# Aims to reproduce the published model from Foster et al. (2019, Earthquake
# Spectra) as closely as the refactored Python pipeline allows. Small
# numerical differences remain, mostly in the MVN-conditioning step near
# observations; see dev/docs/foster_2019_benchmark_status.md.

# --- Categorical model files ---
# Same posteriors as modified_foster_2019 (computed by the original R code).
geology_categorical_csv: geology_model_posterior_from_foster_2019_mean_and_standard_deviation.csv
terrain_categorical_csv: terrain_model_posterior_from_foster_2019_mean_and_standard_deviation.csv

# --- Observation files ---
# Original excludes ALL Kaiser Q3 stations.
independent_observations_csv: foster_2019_approx_measured_vs30_independent_observations.csv
clustered_observations_csv:

# --- Pipeline settings ---
do_bayesian_update: false
noisy: true
combination_method: ratio
combine_ratio: 1.0

# --- Hybrid geology modifications ---
# Original: slope only, no coastal distance adjustments.
apply_alluvium_slope_mod: true
apply_coastal_distance_mod: false
fill_gaps: false

# --- Spatial correlation ---
# Geology: Matérn (κ=0.9) as fitted in the original R code.
geology_correlation:
  model: matern
  range: 20000
  sill: 0.15
  nugget: 0.05
  kappa: 0.9

# Terrain: Exponential. The original R code uses Matérn with κ=0.5,
# which is mathematically equivalent to exponential.
terrain_correlation:
  model: exponential
  phi: 993
