[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Vs30"
version = "2026.10.1"
description = "NZ Vs30 Calculation"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "geopandas",
    "typer",
    "qcore-utils[cli]",
    "rasterio",
    "threadpoolctl",
    "tqdm",
    "pyyaml",
    "shapely",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pyproj"]

[dependency-groups]
dev = ["deptry", "npdlint", "ruff", "ty"]

[project.urls]
Repository = "https://github.com/ucgmsim/Vs30"

[project.scripts]
vs30 = "vs30.cli:app"

[tool.setuptools]
packages = ["vs30"]

[tool.setuptools.package-data]
vs30 = [
    "configs/*.yaml",
    "resources/geospatial/*.tif",
    "resources/geospatial/*.tar.xz",
    "resources/geospatial/coast/*",
    "resources/geospatial/qmap/*",
    "resources/**/*.csv",
    "resources/**/*.yaml",
    "resources/**/*.npy",
]

[tool.ruff]
exclude = ["VsViewer", "build", "temp"]

[tool.ruff.lint]
# Ruff's default rules before 0.16, listed so that a ruff upgrade can't change which rules apply.
select = ["E4", "E7", "E9", "F"]

[tool.deptry]
# .venv must be listed explicitly because custom exclude overrides deptry's defaults.
exclude = ["VsViewer", ".venv", ".worktrees", "dev", "build"]
optional_dependencies_dev_groups = ["test"]

[tool.deptry.package_module_name_map]
scikit-learn = ["sklearn"]
qcore-utils = ["qcore"]
pyyaml = ["yaml"]

[tool.coverage.run]
omit = [
    "vs30/cli.py",
    "vs30/config.py",
    "vs30/constants.py",
]


[tool.deptry.per_rule_ignores]
DEP001 = ["conftest", "setuptools", "test_benchmarks"]
DEP003 = ["setuptools"]
DEP004 = ["pytest", "pyproj"]

[tool.npdlint]
include = ["vs30"]
numpydoc-compat = false
select = [
  "GL05",
  "GL08",
  "GL10",
  "PR01",
  "PR02",
  "PR03",
  "PR04",
  "PR05",
  "PR06",
  "PR07",
  "RT01",
  "RT02",
  "RT03",
  "RT04",
  "YD01",
]

[tool.ty.src]
exclude = ["dev/", "build/", "VsViewer/", "tests/", "setup.py"]

[tool.ty.rules]
# Typer uses `= ...` (Ellipsis) for required CLI parameters, which is valid
# at runtime but not understood by type checkers.
invalid-parameter-default = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (skipped by default, use --runslow to run)",
]
